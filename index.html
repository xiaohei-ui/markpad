<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf9f6">
<link rel="manifest" href="manifest.json">
<title>MarkPad</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #faf9f6;
  --bg-card: #ffffff;
  --bg-sidebar: #f5f3ef;
  --text: #2c2c2c;
  --text-secondary: #787774;
  --accent: #d97706;
  --accent-light: #fef3c7;
  --border: #e7e5e4;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 20px rgba(0,0,0,0.08);
  --radius: 12px;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --font-serif: "New York", "Noto Serif SC", Georgia, "Times New Roman", serif;
  --font-mono: "SF Mono", "Fira Code", "Menlo", monospace;
  --sidebar-width: 300px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

[data-theme="dark"] {
  --bg: #1c1c1e;
  --bg-card: #2c2c2e;
  --bg-sidebar: #242426;
  --text: #e5e5e7;
  --text-secondary: #98989d;
  --accent: #f59e0b;
  --accent-light: #451a03;
  --border: #3a3a3c;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-lg: 0 4px 20px rgba(0,0,0,0.4);
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
  transition: background 0.3s, color 0.3s;
}

/* ===== Layout ===== */
.app {
  display: flex;
  height: 100vh;
  height: 100dvh;
  position: relative;
}

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding-top: var(--safe-top);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 100;
}

.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-title {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
}

.sidebar-title span {
  color: var(--accent);
}

.sidebar-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text);
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  white-space: nowrap;
}

.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.btn-primary:hover { opacity: 0.9; color: white; }

.btn svg { width: 14px; height: 14px; flex-shrink: 0; }

/* Search */
.search-box {
  position: relative;
  margin-top: 12px;
}

.search-box input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.15s;
}

.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--text-secondary); }

.search-box svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  pointer-events: none;
}

/* Folder Groups */
.folder-group {
  margin-bottom: 4px;
}

.folder-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.folder-header:hover { background: var(--bg-card); }
.folder-header.drag-over { background: var(--accent-light); outline: 2px dashed var(--accent); }

.folder-header .folder-icon {
  font-size: 0.85rem;
  flex-shrink: 0;
  transition: transform 0.15s;
}

.folder-header .folder-name {
  flex: 1;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.folder-header .folder-count {
  font-size: 0.72rem;
  color: var(--text-secondary);
  background: var(--bg);
  padding: 1px 6px;
  border-radius: 10px;
}

.folder-header .folder-delete {
  opacity: 0;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}

.folder-header:hover .folder-delete { opacity: 1; }
.folder-delete:hover { background: #fee2e2; color: #dc2626; }

.folder-group.collapsed .folder-header .folder-icon { transform: rotate(-90deg); }
.folder-group.collapsed .folder-files { display: none; }

/* File List */
.file-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px;
}

.file-list::-webkit-scrollbar { width: 4px; }
.file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.file-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}

.file-item:hover { background: var(--bg-card); }
.file-item.active { background: var(--accent-light); }
.file-item.dragging { opacity: 0.4; }
.file-item.drag-over-item { border-top: 2px solid var(--accent); }
.file-item.active .file-name { color: var(--accent); font-weight: 600; }

.file-icon {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 0.8rem;
  color: var(--accent);
}

.file-info { flex: 1; min-width: 0; }

.file-name {
  font-size: 0.9rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.file-meta {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.file-folder {
  cursor: pointer;
  padding: 1px 4px;
  border-radius: 3px;
  transition: all 0.15s;
}

.file-folder:hover {
  background: var(--accent-light);
  color: var(--accent);
}

.file-delete {
  opacity: 0;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}

.file-item:hover .file-delete { opacity: 1; }
.file-item:hover .file-pin { opacity: 1; }
.file-item:hover .file-move { opacity: 1; }
.file-delete:hover { background: #fee2e2; color: #dc2626; }

.file-pin {
  opacity: 0;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}

.file-pin.pinned { opacity: 1; color: var(--accent); }
.file-pin:hover { background: var(--accent-light); color: var(--accent); }

.file-move {
  opacity: 0;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}

.file-move:hover { background: var(--accent-light); color: var(--accent); }

.file-actions {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}

.sidebar-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: calc(12px + var(--safe-bottom));
}

.file-count {
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.theme-toggle {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

/* ===== Overlay ===== */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 99;
  -webkit-tap-highlight-color: transparent;
}

/* ===== Main Content ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
  height: 100dvh;
}

.topbar {
  display: none;
  align-items: center;
  padding: 8px 16px;
  padding-top: calc(8px + var(--safe-top));
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  gap: 12px;
  min-height: 52px;
}

.topbar-title {
  flex: 1;
  font-size: 0.95rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.menu-btn {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}

/* ===== Content Area ===== */
.content-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* Empty State */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}

.empty-icon {
  width: 80px;
  height: 80px;
  border-radius: 20px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  font-size: 2rem;
}

.empty-title {
  font-family: var(--font-serif);
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}

.empty-desc {
  font-size: 0.9rem;
  max-width: 280px;
  line-height: 1.5;
}

/* Markdown Content */
.markdown-body {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 24px 80px;
  font-family: var(--font-serif);
  font-size: 1.05rem;
  line-height: 1.8;
  color: var(--text);
}

.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 {
  font-family: var(--font-sans);
  font-weight: 700;
  line-height: 1.3;
  margin-top: 2em;
  margin-bottom: 0.6em;
  letter-spacing: -0.02em;
}

.markdown-body h1 { font-size: 1.8rem; margin-top: 0; }
.markdown-body h2 { font-size: 1.4rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
.markdown-body h3 { font-size: 1.15rem; }

.markdown-body p { margin-bottom: 1em; }
.markdown-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.markdown-body blockquote {
  border-left: 3px solid var(--accent);
  padding: 0.5em 1em;
  margin: 1em 0;
  color: var(--text-secondary);
  background: var(--accent-light);
  border-radius: 0 8px 8px 0;
}

.markdown-body code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--bg-sidebar);
  padding: 2px 6px;
  border-radius: 4px;
}

.markdown-body pre {
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  overflow-x: auto;
  margin: 1em 0;
  -webkit-overflow-scrolling: touch;
}

.markdown-body pre code {
  background: none;
  padding: 0;
  font-size: 0.85rem;
  line-height: 1.6;
}

.markdown-body img {
  max-width: 100%;
  border-radius: 8px;
  margin: 1em 0;
}

.markdown-body ul, .markdown-body ol {
  padding-left: 1.5em;
  margin-bottom: 1em;
}

.markdown-body li { margin-bottom: 0.3em; }

.markdown-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 1em 0;
  font-family: var(--font-sans);
  font-size: 0.9rem;
}

.markdown-body th, .markdown-body td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: left;
}

.markdown-body th { background: var(--bg-sidebar); font-weight: 600; }

.markdown-body hr {
  border: none;
  height: 1px;
  background: var(--border);
  margin: 2em 0;
}

.markdown-body input[type="checkbox"] {
  margin-right: 6px;
  accent-color: var(--accent);
}

/* ===== Drop Zone ===== */
.drop-zone {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(217, 119, 6, 0.1);
  border: 3px dashed var(--accent);
  z-index: 200;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.drop-zone.active { display: flex; }

.drop-zone-text {
  font-family: var(--font-sans);
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--accent);
  background: var(--bg-card);
  padding: 20px 32px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: calc(24px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 300;
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* Move Popup */
.move-popup {
  position: fixed;
  z-index: 400;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  padding: 4px;
  min-width: 140px;
  max-height: 240px;
  overflow-y: auto;
  animation: fadeIn 0.15s ease;
}

.move-popup-item {
  display: block;
  width: 100%;
  padding: 7px 12px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 0.82rem;
  text-align: left;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.1s;
}

.move-popup-item:hover { background: var(--accent-light); color: var(--accent); }
.move-popup-item.current { color: var(--accent); font-weight: 600; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .topbar { display: flex; }
  .markdown-body { padding: 24px 16px 60px; }
  .markdown-body h1 { font-size: 1.5rem; }
}

@media (min-width: 769px) {
  .sidebar-overlay { display: none !important; }
}

/* ===== Animations ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.markdown-body { animation: fadeIn 0.3s ease; }

/* ===== Print ===== */
@media print {
  .sidebar, .topbar { display: none !important; }
  .main { height: auto; }
  .content-area { overflow: visible; }
  .markdown-body { max-width: 100%; padding: 0; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Mark<span>Pad</span></div>
      <div class="sidebar-actions">
        <button class="btn btn-primary" id="uploadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          上传文件
        </button>
        <button class="btn" id="newFolderBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
          新建文件夹
        </button>
      </div>
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="搜索文件名或内容...">
      </div>
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="sidebar-footer">
      <span class="file-count" id="fileCount">0 个文件</span>
      <button class="theme-toggle" id="themeToggle" title="切换主题">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar" id="topbar">
      <button class="menu-btn" id="menuBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">MarkPad</div>
    </div>
    <div class="content-area" id="contentArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">M</div>
        <div class="empty-title">欢迎使用 MarkPad</div>
        <div class="empty-desc">上传 .md 文件开始阅读</div>
      </div>
      <div class="markdown-body" id="markdownBody" style="display:none;"></div>
    </div>
  </main>
</div>

<!-- Drop Zone -->
<div class="drop-zone" id="dropZone">
  <div class="drop-zone-text">松手上传 Markdown 文件</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple style="display:none">

<!-- marked.js for Markdown parsing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>

<script>
// ===== IndexedDB Storage =====
const DB_NAME = 'markpad-db';
const DB_VERSION = 2;
const STORE_NAME = 'files';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
      // Migrate v1 → v2: add folder & pinned fields
      if (e.oldVersion < 2) {
        const tx = e.target.transaction;
        const store = tx.objectStore(STORE_NAME);
        const cursorReq = store.openCursor();
        cursorReq.onsuccess = (ev) => {
          const cursor = ev.target.result;
          if (cursor) {
            const val = cursor.value;
            if (!val.folder) val.folder = '默认';
            if (val.pinned === undefined) val.pinned = false;
            cursor.update(val);
            cursor.continue();
          }
        };
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(file) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.put(file);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ===== App State =====
let files = [];
let activeFileId = null;
let searchQuery = '';
let collapsedFolders = new Set();
let isInternalDrag = false;

// ===== DOM =====
const $ = (sel) => document.querySelector(sel);
const sidebar = $('#sidebar');
const overlay = $('#overlay');
const fileList = $('#fileList');
const fileCount = $('#fileCount');
const emptyState = $('#emptyState');
const markdownBody = $('#markdownBody');
const topbarTitle = $('#topbarTitle');
const fileInput = $('#fileInput');
const dropZone = $('#dropZone');
const toast = $('#toast');
const searchInput = $('#searchInput');

// ===== Theme =====
function getTheme() {
  return localStorage.getItem('markpad-theme') || 'light';
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('markpad-theme', theme);
  const icon = $('#themeIcon');
  if (theme === 'dark') {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}

$('#themeToggle').addEventListener('click', () => {
  setTheme(getTheme() === 'dark' ? 'light' : 'dark');
});

setTheme(getTheme());

// ===== Toast =====
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ===== Markdown Rendering =====
marked.setOptions({
  breaks: true,
  gfm: true,
});

function renderMarkdown(text) {
  // Process checkbox syntax
  const processed = text.replace(/^(\s*)-\s*\[([ xX])\]\s/gm, (match, space, checked) => {
    return `${space}- <input type="checkbox" ${checked !== ' ' ? 'checked' : ''} disabled> `;
  });
  return marked.parse(processed);
}

// ===== File Management =====
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function formatDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
  return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

async function loadFiles() {
  files = await dbGetAll();
  files.sort((a, b) => b.updatedAt - a.updatedAt);
  renderFileList();
}

function getFilteredFiles() {
  let filtered = files;

  // Filter by search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(f =>
      f.name.toLowerCase().includes(q) ||
      f.content.toLowerCase().includes(q)
    );
  }

  // Sort: pinned first, then by updatedAt
  filtered.sort((a, b) => {
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    return b.updatedAt - a.updatedAt;
  });

  return filtered;
}

function renderFileList() {
  const filtered = getFilteredFiles();
  fileCount.textContent = `${filtered.length} / ${files.length} 个文件`;

  // Group by folder
  const groups = {};
  filtered.forEach(f => {
    const folder = f.folder || '默认';
    if (!groups[folder]) groups[folder] = [];
    groups[folder].push(f);
  });

  // Include empty folders from localStorage
  const savedFolders = JSON.parse(localStorage.getItem('markpad-folders') || '[]');
  savedFolders.forEach(f => {
    if (!groups[f]) groups[f] = [];
  });

  // Sort folders: '默认' first, then alphabetically
  const folderNames = Object.keys(groups).sort((a, b) => {
    if (a === '默认') return -1;
    if (b === '默认') return 1;
    return a.localeCompare(b);
  });

  if (filtered.length === 0 && folderNames.length === 0) {
    fileList.innerHTML = '<div style="text-align:center;color:var(--text-secondary);font-size:0.85rem;padding:20px;">没有找到文件</div>';
    return;
  }

  fileList.innerHTML = folderNames.map(folder => {
    const isCollapsed = collapsedFolders.has(folder);
    const folderFiles = groups[folder];
    return `
      <div class="folder-group ${isCollapsed ? 'collapsed' : ''}" data-folder="${escapeHtml(folder)}">
        <div class="folder-header" data-folder="${escapeHtml(folder)}">
          <span class="folder-icon">▾</span>
          <span class="folder-name">${escapeHtml(folder)}</span>
          <span class="folder-count">${folderFiles.length}</span>
          ${folder !== '默认' ? `<button class="folder-delete" data-folder="${escapeHtml(folder)}" title="删除文件夹"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>` : ''}
        </div>
        <div class="folder-files">
          ${folderFiles.map(f => `
            <div class="file-item ${f.id === activeFileId ? 'active' : ''}" data-id="${f.id}" draggable="true">
              <div class="file-icon">${f.pinned ? '★' : 'M'}</div>
              <div class="file-info">
                <div class="file-name">${escapeHtml(f.name)}</div>
                <div class="file-meta">${formatSize(f.size)} · ${formatDate(f.updatedAt)}</div>
              </div>
              <div class="file-actions">
                <button class="file-move" data-id="${f.id}" title="移动到文件夹">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                </button>
                <button class="file-pin ${f.pinned ? 'pinned' : ''}" data-id="${f.id}" title="${f.pinned ? '取消收藏' : '收藏'}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="${f.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </button>
                <button class="file-delete" data-id="${f.id}" title="删除">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  // Bind click events
  fileList.querySelectorAll('.file-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.file-delete') || e.target.closest('.file-pin')) return;
      openFile(el.dataset.id);
    });
  });

  fileList.querySelectorAll('.file-delete').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteFile(el.dataset.id);
    });
  });

  fileList.querySelectorAll('.file-pin').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePin(el.dataset.id);
    });
  });

  fileList.querySelectorAll('.file-move').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      moveFile(el.dataset.id, el);
    });
  });

  // Folder header: toggle collapse
  fileList.querySelectorAll('.folder-header').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.folder-delete')) return;
      const folder = el.dataset.folder;
      if (collapsedFolders.has(folder)) {
        collapsedFolders.delete(folder);
      } else {
        collapsedFolders.add(folder);
      }
      el.closest('.folder-group').classList.toggle('collapsed');
    });
  });

  // Folder delete
  fileList.querySelectorAll('.folder-delete').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteFolder(el.dataset.folder);
    });
  });

}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function addFiles(fileObjects) {
  let added = 0;
  for (const file of fileObjects) {
    if (!file.name.match(/\.(md|markdown|txt)$/i)) {
      showToast('跳过非 Markdown 文件: ' + file.name);
      continue;
    }
    const content = await file.text();
    const record = {
      id: generateId(),
      name: file.name,
      content: content,
      size: file.size,
      folder: '默认',
      pinned: false,
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    await dbPut(record);
    files.unshift(record);
    added++;
  }
  if (added > 0) {
    files.sort((a, b) => b.updatedAt - a.updatedAt);
    renderFileList();
    showToast(`已添加 ${added} 个文件`);
    // Auto-open the first added file
    if (files.length > 0) {
      openFile(files[0].id);
    }
  }
}

function openFile(id) {
  const file = files.find(f => f.id === id);
  if (!file) return;

  activeFileId = id;
  emptyState.style.display = 'none';
  markdownBody.style.display = 'block';
  markdownBody.innerHTML = renderMarkdown(file.content);
  topbarTitle.textContent = file.name;
  renderFileList();

  // Close sidebar on mobile
  closeSidebar();

  // Scroll to top
  $('.content-area').scrollTop = 0;

  // Store last opened
  localStorage.setItem('markpad-last', id);
}

async function deleteFile(id) {
  if (!confirm('确定删除这个文件吗？')) return;
  const file = files.find(f => f.id === id);
  await dbDelete(id);
  files = files.filter(f => f.id !== id);

  if (activeFileId === id) {
    activeFileId = null;
    emptyState.style.display = '';
    markdownBody.style.display = 'none';
    topbarTitle.textContent = 'MarkPad';
    localStorage.removeItem('markpad-last');
  }

  // Clean up empty folders from localStorage
  if (file) {
    const folder = file.folder || '默认';
    const hasFilesInFolder = files.some(f => (f.folder || '默认') === folder);
    if (!hasFilesInFolder) {
      const folders = JSON.parse(localStorage.getItem('markpad-folders') || '[]');
      const idx = folders.indexOf(folder);
      if (idx !== -1) {
        folders.splice(idx, 1);
        localStorage.setItem('markpad-folders', JSON.stringify(folders));
      }
    }
  }

  renderFileList();
  showToast('已删除');
}

async function togglePin(id) {
  const file = files.find(f => f.id === id);
  if (!file) return;
  file.pinned = !file.pinned;
  await dbPut(file);
  renderFileList();
  showToast(file.pinned ? '已收藏' : '已取消收藏');
}

async function changeFolder(id) {
  const file = files.find(f => f.id === id);
  if (!file) return;
  const folder = prompt('输入新的文件夹名称：', file.folder || '默认');
  if (folder === null) return;
  file.folder = folder || '默认';
  await dbPut(file);
  renderFileList();
  showToast('已移动到 ' + file.folder);
}

function moveFile(id, anchorEl) {
  const file = files.find(f => f.id === id);
  if (!file) return;
  // Collect all folder names
  const folderSet = new Set(files.map(f => f.folder || '默认'));
  const savedFolders = JSON.parse(localStorage.getItem('markpad-folders') || '[]');
  savedFolders.forEach(f => folderSet.add(f));
  const folderList = [...folderSet].sort((a, b) => {
    if (a === '默认') return -1;
    if (b === '默认') return 1;
    return a.localeCompare(b);
  });

  // Remove existing popup
  const existing = document.querySelector('.move-popup');
  if (existing) existing.remove();

  const popup = document.createElement('div');
  popup.className = 'move-popup';
  popup.innerHTML = folderList.map(f => {
    const isCurrent = f === (file.folder || '默认');
    return `<button class="move-popup-item${isCurrent ? ' current' : ''}" data-folder="${escapeHtml(f)}">${escapeHtml(f)}</button>`;
  }).join('');

  document.body.appendChild(popup);

  // Position near anchor
  const rect = anchorEl.getBoundingClientRect();
  popup.style.top = (rect.bottom + 4) + 'px';
  popup.style.left = Math.min(rect.left, window.innerWidth - 180) + 'px';

  // Click handler
  popup.addEventListener('click', async (e) => {
    const btn = e.target.closest('.move-popup-item');
    if (!btn) return;
    const target = btn.dataset.folder;
    if (target !== (file.folder || '默认')) {
      file.folder = target;
      await dbPut(file);
      renderFileList();
      showToast('已移动到 ' + target);
    }
    popup.remove();
  });

  // Close on outside click
  const close = (e) => {
    if (!popup.contains(e.target)) {
      popup.remove();
      document.removeEventListener('click', close);
    }
  };
  setTimeout(() => document.addEventListener('click', close), 0);
}

function createFolder() {
  const name = prompt('文件夹名称：');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (trimmed === '默认') {
    showToast('默认文件夹已存在');
    return;
  }
  // Check if folder already exists
  const folders = JSON.parse(localStorage.getItem('markpad-folders') || '[]');
  const allFolderNames = new Set(files.map(f => f.folder || '默认'));
  folders.forEach(f => allFolderNames.add(f));
  if (allFolderNames.has(trimmed)) {
    showToast('文件夹已存在');
    return;
  }
  folders.push(trimmed);
  localStorage.setItem('markpad-folders', JSON.stringify(folders));
  renderFileList();
  showToast('已创建文件夹: ' + trimmed);
}

async function deleteFolder(folderName) {
  if (!confirm(`删除文件夹「${folderName}」？里面的文件会移回「默认」`)) return;
  // Move all files in this folder back to 默认
  for (const f of files) {
    if ((f.folder || '默认') === folderName) {
      f.folder = '默认';
      await dbPut(f);
    }
  }
  // Remove from stored folders
  const folders = JSON.parse(localStorage.getItem('markpad-folders') || '[]');
  const idx = folders.indexOf(folderName);
  if (idx !== -1) {
    folders.splice(idx, 1);
    localStorage.setItem('markpad-folders', JSON.stringify(folders));
  }
  renderFileList();
  showToast('文件夹已删除，文件已移回默认');
}

function setupDragAndDrop() {
  // Event delegation on fileList - only bind once
  fileList.addEventListener('dragstart', (e) => {
    const fileItem = e.target.closest('.file-item[draggable]');
    if (!fileItem) return;
    isInternalDrag = true;
    fileItem.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', fileItem.dataset.id);
  });

  fileList.addEventListener('dragend', (e) => {
    const fileItem = e.target.closest('.file-item');
    if (fileItem) fileItem.classList.remove('dragging');
    fileList.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
    isInternalDrag = false;
  });

  fileList.addEventListener('dragover', (e) => {
    const folderHeader = e.target.closest('.folder-header');
    if (!folderHeader) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    folderHeader.classList.add('drag-over');
  });

  fileList.addEventListener('dragleave', (e) => {
    const folderHeader = e.target.closest('.folder-header');
    if (folderHeader && !folderHeader.contains(e.relatedTarget)) {
      folderHeader.classList.remove('drag-over');
    }
  });

  fileList.addEventListener('drop', async (e) => {
    const folderHeader = e.target.closest('.folder-header');
    if (!folderHeader) return;
    e.preventDefault();
    e.stopPropagation();
    folderHeader.classList.remove('drag-over');
    const fileId = e.dataTransfer.getData('text/plain');
    const targetFolder = folderHeader.dataset.folder;
    if (!fileId || !targetFolder) return;

    const file = files.find(f => f.id === fileId);
    if (!file || (file.folder || '默认') === targetFolder) return;

    file.folder = targetFolder;
    await dbPut(file);
    renderFileList();
    showToast('已移动到 ' + targetFolder);
  });
}

// ===== Sidebar Toggle (mobile) =====
function openSidebar() {
  sidebar.classList.add('open');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

$('#menuBtn').addEventListener('click', openSidebar);
overlay.addEventListener('click', closeSidebar);

// ===== File Input =====
$('#uploadBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) {
    addFiles(Array.from(e.target.files));
    fileInput.value = '';
  }
});

$('#newFolderBtn').addEventListener('click', createFolder);

// ===== Drag & Drop =====
let dragCounter = 0;

document.addEventListener('dragenter', (e) => {
  e.preventDefault();
  if (isInternalDrag) return;
  dragCounter++;
  dropZone.classList.add('active');
});

document.addEventListener('dragleave', (e) => {
  e.preventDefault();
  if (isInternalDrag) return;
  dragCounter--;
  if (dragCounter === 0) dropZone.classList.remove('active');
});

document.addEventListener('dragover', (e) => {
  e.preventDefault();
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  dragCounter = 0;
  dropZone.classList.remove('active');
  if (isInternalDrag) return;
  if (e.dataTransfer.files.length > 0) {
    addFiles(Array.from(e.dataTransfer.files));
  }
});

// ===== Search =====
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim();
  renderFileList();
});

// ===== Keyboard Shortcuts =====
document.addEventListener('keydown', (e) => {
  // Cmd/Ctrl + O = upload
  if ((e.metaKey || e.ctrlKey) && e.key === 'o') {
    e.preventDefault();
    fileInput.click();
  }
  // Cmd/Ctrl + F = focus search
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
    e.preventDefault();
    openSidebar();
    searchInput.focus();
  }
  // Escape = close sidebar
  if (e.key === 'Escape') {
    closeSidebar();
  }
});

// ===== Service Worker (PWA) =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ===== Init =====
(async function init() {
  await loadFiles();

  // Clean up stale empty folders from localStorage
  const folders = JSON.parse(localStorage.getItem('markpad-folders') || '[]');
  const activeFolders = new Set(files.map(f => f.folder || '默认'));
  const cleaned = folders.filter(f => activeFolders.has(f));
  if (cleaned.length !== folders.length) {
    localStorage.setItem('markpad-folders', JSON.stringify(cleaned));
  }

  setupDragAndDrop();

  // Restore last opened file
  const lastId = localStorage.getItem('markpad-last');
  if (lastId && files.find(f => f.id === lastId)) {
    openFile(lastId);
  }
})();
</script>
